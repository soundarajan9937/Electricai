<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bill History</title>

    <link rel="stylesheet" href="css/history.css">

</head>

<body>

<div class="container">

    <h1>📜 Electricity Bill History</h1>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by Reading or Date">

    </div>

    <table>

        <thead>

            <tr>

                <th>Meter Image</th>

                <th>Date</th>

                <th>Reading</th>

                <th>Bill</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="historyBody">

            <!-- History records will appear here -->

        </tbody>

    </table>

    <div class="buttons">

        <a href="dashboard.html">
            ⬅ Dashboard
        </a>

        <a href="upload_meter.html">
            📤 Upload New Meter
        </a>

    </div>

</div>

<script src="js/history.js"></script>

</body>

</html>
