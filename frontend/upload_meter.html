<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Meter | Electric AI</title>

    <link rel="stylesheet" href="css/upload.css">
</head>

<body>

<div class="container">

    <div class="upload-box">

        <img src="images/logo.png" class="logo">

        <h1>Upload Electricity Meter</h1>

        <p>
            Upload a clear photo of your electricity meter.
            Our AI will detect the meter reading and calculate your electricity bill.
        </p>

        <div class="preview">

            <img src="images/upload.png" id="previewImage">

        </div>

        <input
            type="file"
            id="fileInput"
            accept="image/*">

        <button onclick="analyzeMeter()">

            Analyze Meter

        </button>

    </div>

</div>

<script src="js/upload.js"></script>

</body>
</html>
