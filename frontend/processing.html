<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Processing</title>

    <link rel="stylesheet" href="css/processing.css">

</head>

<body>

<div class="container">

    <div class="processing-box">

        <img src="images/logo.png" class="logo" alt="Logo">

        <h1>⚡ AI Electricity Bill Analyzer</h1>

        <div class="loader"></div>

        <h2 id="status">
            Uploading Image...
        </h2>

        <p>
            Please wait while our AI analyzes your electricity meter.
        </p>

        <div class="steps">

            <div id="step1">⏳ Uploading Image...</div>

            <div id="step2">⏳ Detecting Meter...</div>

            <div id="step3">⏳ Reading Meter (OCR)...</div>

            <div id="step4">⏳ Calculating Bill...</div>

            <div id="step5">⏳ Preparing Report...</div>

        </div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/processing.js"></script>

</body>

</html>
